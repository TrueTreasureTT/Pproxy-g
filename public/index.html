<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .black-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .black-screen iframe {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="black-screen">
    <iframe
      src="./game.html"
      allow="fullscreen; autoplay; gamepad; pointer-lock"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
